<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project 7 | Javascript | Tips Calculator</title>
    <meta name="description" content="This is my first Javascript project">
    <meta name="keywords" content="HTML, CSS, Javascript, Project">
    <meta name="author" content="Chinedu Jeremy Great">

    <!-- Google Fonts -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Baumans&family=Chango&family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto&family=Sansita:ital,wght@0,400;0,700;0,800;0,900;1,400;1,700;1,800;1,900&display=swap" rel="stylesheet">

    <!-- FAVICON -->
    <link rel="icon" href="images/myFavicon.png" type="image/x-icon">

    <!-- CSS Link -->
    <link rel="stylesheet" href="styles/styles.css">
</head>
<body>
    <main>
        <h1>Tips Calculator | DrJayCode</h1>
        <div class="calculator">
            <label for="billAmount">Bill Amount ($):</label>
            <input type="number" id="billAmount" placeholder="Enter bill amount">

            <label for="rating">Service Rating :</label>
            <select name="rating" id="rating">
                <option value="1">Poor</option>
                <option value="2">Fair</option>
                <option value="3">Good</option>
                <option value="4">Very Good</option>
                <option value="5">Excellent</option>
            </select>

            <label for="numberOfPeople">Number of People:</label>
            <input type="number" id="numberOfPeople" placeholder="Enter number of people">

            <label for="mealType">Meal Type:</label>
            <input type="text" id="mealType" placeholder="Enter meal type">

            <div class="results">
                <h2>Results</h2>
                <p id="tipAmount">Tip Amount: $0.00</p>
                <p id="totalAmount">Total Amount: $0.00</p>
                <p id="perPersonAmount">Per Person Amount: $0.00</p>
            </div>

            <button id="calculateBtn">Calculate Tip</button>
            <button id="resetBtn">Reset</button>
        </div>

        <!-- Javascript Link -->
        <script src="scripts/scripts.js"></script>

    </main>
</body>
</html>
